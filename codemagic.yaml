workflows:
  ios-release:
    name: iOS Build Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Install dependencies and Capacitor iOS
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Create and Sync iOS Platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Build iOS App
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     build
    artifacts:
      - ios/App/Build/Products/Release-iphoneos/*.app
      - build/*.xcarchive
